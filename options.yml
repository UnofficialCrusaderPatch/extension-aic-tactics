meta:
  version: 1.0.0
options:
- category: ['{{ai}}', '{{improvements}}', '{{cat_attacks_raids}}']
  name: attack_patrols
  display: GroupBox
  header: '{{attack_patrols}}'
  text: '{{tactics_defaults}}'
  children:
  - name: patrolOrders
    header: '{{patrolOrders}}'
    text: '{{patrolOrders_descr}}'
    display: Choice
    url: aic-tactics.patrolOrders
    contents:
      choices:
      - name: AllGroups
        text: '{{patrolOrders_all}}'
      - name: Native
        text: '{{patrolOrders_native}}'
      value: Native
  - name: patrolFormation
    header: '{{patrolFormation}}'
    text: '{{patrolFormation_descr}}'
    display: Choice
    url: aic-tactics.patrolFormation
    contents:
      choices:
      - name: Wing
        text: '{{patrolFormation_wing}}'
      - name: Mirror
        text: '{{patrolFormation_mirror}}'
      - name: Routes
        text: '{{patrolFormation_routes}}'
      - name: Native
        text: '{{patrolFormation_native}}'
      value: Native
- category: ['{{ai}}', '{{improvements}}', '{{cat_siege_crews}}']
  name: siege_tactics
  display: GroupBox
  header: '{{siege_tactics}}'
  children:
  - name: siegeScreen
    header: '{{siegeScreen}}'
    text: '{{siegeScreen_descr}}'
    display: Choice
    url: aic-tactics.siegeScreen
    contents:
      choices:
      - name: EngineApproach
        text: '{{siegeScreen_engineApproach}}'
      - name: Native
        text: '{{siegeScreen_native}}'
      value: Native
  - name: siegeTowerCrew
    header: '{{siegeTowerCrew}}'
    text: '{{siegeTowerCrew_descr}}'
    display: UCP2Switch
    url: aic-tactics.siegeTowerCrew
    contents:
      type: boolean
      value: false
- category: ['{{ai}}', '{{improvements}}', '{{cat_attacks_raids}}']
  name: lordHuntRetarget
  header: '{{lordHuntRetarget}}'
  text: '{{lordHuntRetarget_descr}}'
  display: UCP2Switch
  url: aic-tactics.lordHuntRetarget
  contents:
    type: boolean
    value: false
- category: ['{{ai}}', '{{improvements}}', '{{cat_allies_outposts}}']
  name: ally_help
  display: GroupBox
  header: '{{ally_help}}'
  children:
  - name: allyRelief
    header: '{{allyRelief}}'
    text: '{{allyRelief_descr}}'
    display: UCP2Switch
    url: aic-tactics.allyRelief
    contents:
      type: boolean
      value: false
  - name: allyGoods
    header: '{{allyGoods}}'
    text: '{{allyGoods_descr}}'
    display: UCP2Switch
    url: aic-tactics.allyGoods
    contents:
      type: boolean
      value: false
