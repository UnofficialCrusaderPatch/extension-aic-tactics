name: Recruitment provider integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/extension-aicloader
          ref: 7e92bd4722d02a5e6f8111e24c751f4443361069
          path: tests/deps/aicloader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 lupa==2.6
      - run: python -m pytest tests -q
