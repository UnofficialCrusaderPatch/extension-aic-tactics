name: Recruitment provider integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/extension-aicloader
          ref: 0356b1aa2b99e89af443a2613abb03e8aa25aa49
          path: tests/deps/aicloader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 lupa==2.6
      - run: python -m pytest tests -q
