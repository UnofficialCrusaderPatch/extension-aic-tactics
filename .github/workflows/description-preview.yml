name: Description preview ZIP

on:
  pull_request:
  push:
    branches: [docs/gui-description-locales]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify preview ZIP
        run: python tools/package_description_preview.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: aic-tactics-description-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 30
