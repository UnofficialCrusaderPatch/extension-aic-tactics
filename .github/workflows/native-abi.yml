name: Microsoft x86 adapter build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      map_state_repository:
        description: Repository containing the reviewed Map Extensions state prerequisite
        required: true
        type: string
      map_state_ref:
        description: Full commit SHA of the Map Extensions state prerequisite
        required: true
        type: string
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cmake -S . -B build -A Win32 -DAIC_TACTICS_BUILD_SHC141_PROBE=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/checkout@v4
        with:
          repository: UnofficialCrusaderPatch/extension-aicloader
          ref: 24ea47c20f62082f8a1b06969089898a8285add9
          path: tests/deps/aicloader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: ${{ inputs.map_state_repository }}
          ref: ${{ inputs.map_state_ref }}
          path: tests/deps/map-extensions
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        run: python tests/package_runtime.py --dll build/Release/aicTactics.dll --loader tests/deps/aicloader --map-extensions tests/deps/map-extensions --output build/package/aic-tactics-combat-test.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: aic-tactics-combat-test
          path: build/package/aic-tactics-combat-test.zip
          retention-days: 21
