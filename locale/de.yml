legacyRecruitInterval: Legacy-Rekrutierungstakt beibehalten
legacyRecruitInterval_descr: 'Ersetzt Legacy ai_recruitinterval für Native-Persönlichkeiten: Intervall 1. WeightedRoles nutzt weiterhin die AIC-Intervalle. Die Legacy-Option muss AUS sein. War sie bisher aus, bleibt auch diese Option aus.'
nativeInitialDefenseMonths: Anfängliche Verteidigungsphase für Native-KIs
nativeInitialDefenseMonths_descr: '0–30 Monate, Standard 6. Übernimm hier den bisherigen Wert des Legacy-Starttimers und schalte die Legacy-Option aus. Bei WeightedRoles gilt RecruitInitialDefenseMonths.'
nativeTargetPolicy: "Zielwahl für Native-KIs"
nativeTargetPolicy_descr: "Ersetzt Legacy ai_attacktarget. Übernimm dessen Auswahl hier und schalte die Legacy-Option bei neuen Zielregeln aus. Native behält TargetChoice bei."
nativeTargetPolicy_native: "Bisheriges TargetChoice"
nativeTargetPolicy_nearest: "Nächster Gegner"
nativeTargetPolicy_richest: "Reichster Gegner"
nativeTargetPolicy_weakest: "Schwächster Gegner"
correctEngineerRoleCounting: "Ingenieure richtig zählen"
correctEngineerRoleCounting_descr: "Zählt zugewiesene Ingenieure im jeweiligen Truppenverband. Besatzungen, Grabendienste und Ölarbeiter behalten ihre eigenen Aufgaben."
safeSiegePlacement: "Eigene Einheiten beim Belagerungsbau schützen"
safeSiegePlacement_descr: "Verhindert den Bau von Belagerungsgeräten auf eigenen Einheiten. Der AIC-Wert hat Vorrang."
actualSiegeResourcePayment: "Belagerungsbau nur mit Rohstoffen"
actualSiegeResourcePayment_descr: "Prüft Rohstoffe und Gold vor dem Bau. Fehlmengen gehen in den normalen KI-Handel. Der AIC-Wert je KI hat Vorrang."
coordinatedSiegeHarassment: "Belagerungsangriffe koordinieren"
coordinatedSiegeHarassment_descr: "Belagerungsgeräte sammeln und gemeinsam zu erreichbaren Schusspositionen schicken. Der AIC-Wert je KI hat Vorrang."
siegeHarassMinEngines: "Mindestzahl für Belagerungsangriffe"
siegeHarassMinEngines_descr: "So viele Geräte vor dem Aufbruch abwarten. Nach einem Spielmonat starten die vorhandenen; 0 startet mit dem ersten Gerät."
largerSiegeForces: "Mehr Belagerungsgeräte im Hauptangriff"
largerSiegeForces_descr: "Wiederholt den eingestellten Gerätemix bis zur Obergrenze. AIC-Werte je KI haben Vorrang."
siegeForceMax: "Geräte pro Hauptangriff"
siegeForceMax_descr: "Optionale Geräteobergrenze. Bei 0 bestimmen die verfügbaren Angriffsingenieure die Zahl; Standard 0."
