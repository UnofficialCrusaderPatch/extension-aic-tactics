legacyRecruitInterval: حفظ آهنگ سربازگیری Legacy
legacyRecruitInterval_descr: 'جایگزین ai_recruitinterval در Legacy می‌شود: شخصیت‌های Native از فاصلهٔ ۱ استفاده می‌کنند. WeightedRoles فاصله‌های AIC را نگه می‌دارد. گزینهٔ Legacy را خاموش کنید؛ اگر قبلاً خاموش بود، این گزینه را هم خاموش بگذارید.'
nativeInitialDefenseMonths: مدت دفاع اولیه برای هوش مصنوعی Native
nativeInitialDefenseMonths_descr: '۰ تا ۳۰ ماه؛ پیش‌فرض ۶. مقدار قبلی زمان‌سنج اولیهٔ Legacy را اینجا وارد کنید و آن گزینهٔ Legacy را خاموش کنید. WeightedRoles از RecruitInitialDefenseMonths استفاده می‌کند.'
nativeTargetPolicy: "انتخاب هدف برای هوش مصنوعی Native"
nativeTargetPolicy_descr: "جایگزین Legacy ai_attacktarget است. انتخاب آن را اینجا وارد کنید و هنگام استفاده از قواعد هدف‌گیری جدید، آن گزینهٔ Legacy را خاموش کنید. Native تنظیم TargetChoice را حفظ می‌کند."
nativeTargetPolicy_native: "TargetChoice فعلی"
nativeTargetPolicy_nearest: "نزدیک‌ترین"
nativeTargetPolicy_richest: "ثروتمندترین"
nativeTargetPolicy_weakest: "ضعیف‌ترین"
safeSiegePlacement: "حفاظت از نیروها هنگام ساخت ادوات محاصره"
safeSiegePlacement_descr: "روی نیروهای خودی ادوات محاصره نمی‌سازد. مقدار AIC هر هوش مصنوعی اولویت دارد."
correctEngineerRoleCounting: "شمارش مهندسان در سهمیهٔ نیروها"
correctEngineerRoleCounting_descr: "مهندسان را بر پایهٔ نقش نظامی کنونی‌شان می‌شمارد. خدمهٔ ادوات محاصره و کارکنان روغن در این سهمیه‌ها حساب نمی‌شوند. مقدار AIC اولویت دارد."
actualSiegeResourcePayment: "نیاز به منابع برای ساخت ادوات محاصره"
actualSiegeResourcePayment_descr: "پیش از ساخت، مصالح و طلا را بررسی می‌کند. کمبودها وارد روند معمول خرید هوش مصنوعی می‌شوند. مقدار AIC هر هوش مصنوعی اولویت دارد."
coordinatedSiegeHarassment: "هماهنگی یورش ادوات محاصره"
coordinatedSiegeHarassment_descr: "ادوات محاصره را گرد می‌آورد و به مواضع تیراندازی قابل دسترس می‌فرستد. مقدار AIC هر هوش مصنوعی اولویت دارد."
siegeHarassMinEngines: "حداقل ادوات برای یورش"
siegeHarassMinEngines_descr: "تعداد ادواتی که پیش از حرکت منتظر می‌مانند. پس از یک ماه بازی، ادوات موجود اعزام می‌شوند؛ ۰ با اولین دستگاه حرکت می‌کند."
