legacyRecruitInterval: Сохранить темп найма Legacy
legacyRecruitInterval_descr: 'Заменяет ai_recruitinterval из Legacy: для личностей Native используется интервал 1. WeightedRoles сохраняет интервалы AIC. Отключите опцию Legacy; если она уже была отключена, оставьте эту опцию выключенной.'
nativeInitialDefenseMonths: Начальный период обороны для ИИ Native
nativeInitialDefenseMonths_descr: '0–30 месяцев, по умолчанию 6. Перенесите сюда прежнее значение начального таймера Legacy и отключите эту настройку Legacy. Для WeightedRoles действует RecruitInitialDefenseMonths.'
nativeTargetPolicy: "Выбор цели для Native ИИ"
nativeTargetPolicy_descr: "Заменяет Legacy ai_attacktarget. Перенесите его выбор сюда и отключите эту опцию Legacy для новых правил выбора цели. Native сохраняет TargetChoice."
nativeTargetPolicy_native: "Исходный TargetChoice"
nativeTargetPolicy_nearest: "Ближайший"
nativeTargetPolicy_richest: "Самый богатый"
nativeTargetPolicy_weakest: "Самый слабый"
correctEngineerRoleCounting: "Учитывать инженеров в квотах войск"
correctEngineerRoleCounting_descr: "Учитывает назначенных инженеров в их отрядах. Осадные расчёты, землекопы и работники с маслом сохраняют отдельные роли."
safeSiegePlacement: "Защищать войска при осадном строительстве"
safeSiegePlacement_descr: "Не строит осадные машины поверх своих войск. Значение AIC каждого ИИ имеет приоритет."
actualSiegeResourcePayment: "Требовать ресурсы для осады"
actualSiegeResourcePayment_descr: "Перед постройкой проверяет материалы и золото. Недостающее поступает в обычную торговую очередь ИИ. Значение AIC каждого ИИ имеет приоритет."
coordinatedSiegeHarassment: "Согласованный рейд осадных машин"
coordinatedSiegeHarassment_descr: "Собирает осадные машины и отправляет их на доступные огневые позиции. Значение AIC каждого ИИ имеет приоритет."
siegeHarassMinEngines: "Число машин для рейда"
siegeHarassMinEngines_descr: "Сколько машин ждать перед выходом. Через игровой месяц отправляются имеющиеся; 0 — выход с первой машиной."
largerSiegeForces: "Больше осадных машин в главной атаке"
largerSiegeForces_descr: "Повторяет заданный состав осадных машин до указанного предела. Значение AIC каждого ИИ имеет приоритет."
siegeForceMax: "Машин на главную атаку"
siegeForceMax_descr: "Необязательный предел осадных машин. При 0 число определяют доступные инженеры атаки; по умолчанию 0."
