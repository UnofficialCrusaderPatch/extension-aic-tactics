legacyRecruitInterval: 保留 Legacy 招募间隔
legacyRecruitInterval_descr: '替代 Legacy 的 ai_recruitinterval：Native 个性使用间隔 1，WeightedRoles 仍使用各自的 AIC 间隔。请关闭 Legacy 中的该选项；如果原本未启用，也请关闭此选项。'
nativeInitialDefenseMonths: Native AI 的初期防御时长
nativeInitialDefenseMonths_descr: '0–30 个月，默认 6。将 Legacy 初期计时器的原有数值填入此处，然后关闭该 Legacy 选项。WeightedRoles 使用 RecruitInitialDefenseMonths。'
nativeTargetPolicy: "Native AI 的目标选择"
nativeTargetPolicy_descr: "替代 Legacy ai_attacktarget。使用新目标规则时，将原选项复制到这里并关闭该 Legacy 选项。Native 保留 TargetChoice。"
nativeTargetPolicy_native: "现有 TargetChoice"
nativeTargetPolicy_nearest: "最近"
nativeTargetPolicy_richest: "最富有"
nativeTargetPolicy_weakest: "最弱"
safeSiegePlacement: "保护攻城建造地点的友军"
safeSiegePlacement_descr: "不会在自己的单位所在位置建造攻城器械。各 AI 的 AIC 设置优先。"
correctEngineerRoleCounting: "将工程兵计入部队配额"
correctEngineerRoleCounting_descr: "按当前部队职责统计工程兵。攻城器械乘员和油锅值守人员不计入这些配额。该 AI 的 AIC 设置优先。"
actualSiegeResourcePayment: "攻城建造需有资源"
actualSiegeResourcePayment_descr: "建造前检查材料和金币；缺少的材料交由 AI 的常规贸易购买。各 AI 的 AIC 设置优先。"
coordinatedSiegeHarassment: "协同攻城骚扰"
coordinatedSiegeHarassment_descr: "先集结攻城器械，再前往不同的可达射击位置。各 AI 的 AIC 设置优先。"
siegeHarassMinEngines: "攻城骚扰集结数量"
siegeHarassMinEngines_descr: "出发前等待的器械数量。一个游戏月后派出已有器械；0 表示有一台就出发。"
