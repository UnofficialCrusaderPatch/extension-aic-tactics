legacyRecruitInterval: A Legacy toborzási ütemének megtartása
legacyRecruitInterval_descr: 'A Legacy ai_recruitinterval beállítását helyettesíti: Native személyiségeknél 1-es időköz. A WeightedRoles az AIC időközeit használja. Kapcsold ki a Legacy beállítását; ha eddig sem használtad, ezt is hagyd kikapcsolva.'
nativeInitialDefenseMonths: A Native MI-k kezdeti védelmi időszaka
nativeInitialDefenseMonths_descr: '0–30 hónap, alapérték 6. Másold ide a Legacy kezdeti időzítőjének értékét, majd kapcsold ki azt a Legacy-beállítást. WeightedRoles esetén a RecruitInitialDefenseMonths érvényes.'
nativeTargetPolicy: "Célválasztás Native MI-knél"
nativeTargetPolicy_descr: "A Legacy ai_attacktarget helyettesítője. Másold ide a választását, és új célválasztási szabályoknál kapcsold ki azt a Legacy opciót. Native esetén a TargetChoice marad."
nativeTargetPolicy_native: "Meglévő TargetChoice"
nativeTargetPolicy_nearest: "Legközelebbi"
nativeTargetPolicy_richest: "Leggazdagabb"
nativeTargetPolicy_weakest: "Leggyengébb"
safeSiegePlacement: "Saját egységek védelme ostromépítéskor"
safeSiegePlacement_descr: "Nem épít ostromeszközt saját egységekre. Az adott MI AIC-értéke elsőbbséget élvez."
correctEngineerRoleCounting: "Mérnökök számolása a csapatkeretben"
correctEngineerRoleCounting_descr: "A mérnököket az aktuális katonai szerepük szerint számolja. Az ostromgépek kezelői és az olajos szolgálat nem töltik fel a csapatkeretet. Az AIC értéke elsőbbséget élvez."
actualSiegeResourcePayment: "Ostromépítés csak fedezettel"
actualSiegeResourcePayment_descr: "Építés előtt ellenőrzi az anyagokat és az aranyat. A hiány a szokásos MI-kereskedéshez kerül. Az egyes MI-k AIC-értéke elsőbbséget élvez."
coordinatedSiegeHarassment: "Ostromgépek összehangolt bevetése"
coordinatedSiegeHarassment_descr: "Összegyűjti az ostromgépeket, majd elérhető tüzelőállásokba küldi őket. Az egyes MI-k AIC-értéke elsőbbséget élvez."
siegeHarassMinEngines: "Bevetéshez várt ostromgépek"
siegeHarassMinEngines_descr: "Ennyi gépre vár indulás előtt. Egy játékbeli hónap után a meglévőket küldi; 0 az első géppel indul."
largerSiegeForces: "Több ostromgép a fő támadáshoz"
largerSiegeForces_descr: "A beállított ostromgép-összetételt ismétli a felső határig. Az egyes MI-k AIC-értéke elsőbbséget élvez."
siegeForceMax: "Ostromgépek fő támadásonként"
siegeForceMax_descr: "Egy támadásban építhető gépek felső határa. A 0 megtartja az eredeti egyszeri építést; alapérték: 10."
