legacyRecruitInterval: Keep Legacy recruitment timing
nativeInitialDefenseMonths: Initial defense period for Native AIs
nativeInitialDefenseMonths_descr: '0–30 months; default 6. Copy the former Legacy initial-timer value here, then turn that Legacy option OFF. WeightedRoles uses RecruitInitialDefenseMonths instead.'
legacyRecruitInterval_descr: 'Replaces Legacy ai_recruitinterval for Native personalities: use interval 1. WeightedRoles keeps each personality’s AIC intervals. Turn the Legacy option OFF; leave this OFF if it was already disabled.'
nativeTargetPolicy: "Target choice for Native AIs"
nativeTargetPolicy_descr: "Replaces Legacy ai_attacktarget. Copy its choice here and turn that Legacy option OFF when using new target policies. Native keeps TargetChoice."
nativeTargetPolicy_native: "Existing TargetChoice"
nativeTargetPolicy_nearest: "Nearest"
nativeTargetPolicy_richest: "Richest"
nativeTargetPolicy_weakest: "Weakest"
safeSiegePlacement: "Protect units at siege sites"
safeSiegePlacement_descr: "Avoid siege construction on friendly units. Each AI's AIC value takes precedence."
correctEngineerRoleCounting: "Count engineers in AI troop quotas"
correctEngineerRoleCounting_descr: "Count engineers in their current troop role. Siege crews and oil workers do not fill troop quotas. Each AI's AIC value overrides this fallback."
actualSiegeResourcePayment: "Require resources for siege construction"
actualSiegeResourcePayment_descr: "Check materials and gold before an AI builds siege equipment. Shortages enter normal AI trade. Each AI's AIC value overrides this fallback."
coordinatedSiegeHarassment: "Coordinate siege harassment"
coordinatedSiegeHarassment_descr: "Gather mobile siege engines, then send them to separate reachable firing positions. Each AI's AIC value takes precedence."
siegeHarassMinEngines: "Siege harass group size"
siegeHarassMinEngines_descr: "Ready engines to wait for before moving. After one game month, send those available. 0 sends the first ready engine."
largerSiegeForces: "More engines for main attacks"
largerSiegeForces_descr: "Repeat the AI's existing siege mix, up to its assault limit. Each AI's AIC value takes precedence."
siegeForceMax: "Engines per main attack"
siegeForceMax_descr: "Maximum engines built for one assault. 0 keeps the native single batch; default 10."
