legacyRecruitInterval: Keep Legacy recruitment timing
nativeInitialDefenseMonths: Initial defense period for Native AIs
nativeInitialDefenseMonths_descr: '0–30 months; default 6. Copy the former Legacy initial-timer value here, then turn that Legacy option OFF. WeightedRoles uses RecruitInitialDefenseMonths instead.'
legacyRecruitInterval_descr: 'Replaces Legacy ai_recruitinterval for Native personalities: use interval 1. WeightedRoles keeps each personality’s AIC intervals. Turn the Legacy option OFF; leave this OFF if it was already disabled.'
