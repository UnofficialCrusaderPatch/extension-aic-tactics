legacyRecruitInterval: Conserver le rythme de recrutement Legacy
legacyRecruitInterval_descr: 'Remplace ai_recruitinterval de Legacy pour les personnalités Native : intervalle 1. WeightedRoles conserve les intervalles AIC. Désactivez l’option Legacy ; laissez celle-ci désactivée si vous ne l’utilisiez pas.'
nativeInitialDefenseMonths: Période de défense initiale des IA Native
nativeInitialDefenseMonths_descr: '0–30 mois, 6 par défaut. Recopiez ici la durée initiale de Legacy, puis désactivez cette option Legacy. WeightedRoles utilise RecruitInitialDefenseMonths.'
nativeTargetPolicy: "Cible des IA Native"
nativeTargetPolicy_descr: "Remplace Legacy ai_attacktarget. Recopiez son choix ici et désactivez cette option Legacy pour les nouvelles règles de ciblage. Native conserve TargetChoice."
nativeTargetPolicy_native: "TargetChoice existant"
nativeTargetPolicy_nearest: "Plus proche"
nativeTargetPolicy_richest: "Plus riche"
nativeTargetPolicy_weakest: "Plus faible"
safeSiegePlacement: "Protéger les unités lors d’un siège"
safeSiegePlacement_descr: "Évite de construire sur ses propres unités. La valeur AIC de chaque IA prévaut."
correctEngineerRoleCounting: "Compter les ingénieurs dans les quotas"
correctEngineerRoleCounting_descr: "Compte les ingénieurs selon leur rôle militaire actuel. Les servants de siège et les préposés à l’huile ne remplissent pas ces quotas. La valeur AIC prévaut."
actualSiegeResourcePayment: "Exiger les ressources pour le siège"
actualSiegeResourcePayment_descr: "Vérifie les matériaux et l’or avant la construction. Les manques passent par le commerce normal de l’IA. La valeur AIC de chaque IA prime."
coordinatedSiegeHarassment: "Coordonner le harcèlement de siège"
coordinatedSiegeHarassment_descr: "Rassemble les engins et les envoie vers des positions de tir accessibles. La valeur AIC de chaque IA prime."
siegeHarassMinEngines: "Engins à rassembler"
siegeHarassMinEngines_descr: "Nombre d’engins attendus avant le départ. Après un mois de jeu, les engins disponibles partent ; 0 lance le premier."
largerSiegeForces: "Plus d’engins pour l’assaut principal"
largerSiegeForces_descr: "Répète la composition de siège de cette IA jusqu’à sa limite. La valeur AIC de chaque IA prime."
siegeForceMax: "Engins par assaut principal"
siegeForceMax_descr: "Maximum construit pour un assaut. 0 conserve la seule série native ; valeur par défaut : 10."
